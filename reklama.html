<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TestyOdRęki</title>
<link rel="icon" href="tod-content/favicon-testyodreki-logo.svg" type="image/svg+xml">
<style>
:root{--b1:#0511F2;--b2:#0455BF;--b3:#0597F2;--c:#05F2DB;--b4:#008FFD;--bg:#F4F9FF;--ink:#06145C}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{font-family:'Hartwell',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden}
.pin{position:relative}
.stick{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;text-align:center;padding:0 6vw}

.hero{height:280vh}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;will-change:transform}
.blob.a{width:44vmax;height:44vmax;background:var(--c);left:-12vmax;top:-10vmax;transform:translate(calc(var(--p)*30vw),calc(var(--p)*40vh)) scale(calc(1 + var(--p)*.6))}
.blob.b{width:40vmax;height:40vmax;background:var(--b3);right:-14vmax;top:20vh;transform:translate(calc(var(--p)*-34vw),calc(var(--p)*-30vh))}
.blob.c{width:30vmax;height:30vmax;background:var(--b1);opacity:.25;left:30vw;bottom:-18vmax;transform:translateY(calc(var(--p)*-40vh)) scale(calc(1 + var(--p)))}
.logo{position:relative;width:min(70vw,640px);transform:translateY(calc(var(--p)*-16vh)) scale(calc(1 - var(--p)*.45));transform-origin:center bottom}
.hint{position:absolute;bottom:5vh;font-size:.95rem;opacity:calc(1 - var(--p)*6);animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(8px)}}
.slogan{position:relative;font-weight:800;font-size:clamp(2.2rem,7.2vw,6.4rem);line-height:1.02;letter-spacing:-.03em;margin-top:2vh;max-width:15ch}
.w{display:inline-block;opacity:.08;transform:translateY(24px);margin-right:.22em;transition:opacity .25s,transform .25s}
.w.on{opacity:1;transform:none}
.w.big{color:var(--b1)}
  
.six{height:360vh}
.sixbg{position:absolute;inset:0;background:linear-gradient(135deg,var(--b1),var(--b2) 55%,var(--b3));opacity:calc((var(--p) - .3)*3)}
.digit{position:absolute;font-weight:900;font-size:34vmin;line-height:1;background:linear-gradient(120deg,var(--b1),var(--b3) 50%,var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;transform:rotate(calc(var(--p)*-12deg)) scale(calc(.6 + var(--p)*var(--p)*22));opacity:calc(1 - (var(--p) - .5)*4)}
.sixtext{position:relative;color:#fff;font-weight:800;font-size:clamp(1.8rem,5vw,4rem);line-height:1.1;letter-spacing:-.02em;max-width:18ch;opacity:calc((var(--p) - .55)*4);transform:translateY(calc((1 - var(--p))*30vh * .6))}
.sixtext span{color:var(--c)}

.say{height:260vh}
.say p{font-weight:800;font-size:clamp(1.9rem,5.4vw,4.6rem);line-height:1.12;letter-spacing:-.025em;max-width:20ch}
.say .r{opacity:.12;transition:opacity .2s}
.say .r.on{opacity:1}
.tags{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;margin-top:5vh;opacity:calc((var(--p) - .7)*4);transform:translateY(calc((1 - var(--p))*40px))}
.tags i{font-style:normal;padding:.55rem 1.1rem;border-radius:99px;background:#fff;border:2px solid var(--b4);font-weight:700;font-size:1rem}
.tags i:nth-child(2){border-color:var(--c)}.tags i:nth-child(3){border-color:var(--b1)}

.cta{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5rem;text-align:center;padding:12vh 6vw;position:relative;overflow:hidden}
.cta h2{font-weight:800;font-size:clamp(2.2rem,6vw,5rem);letter-spacing:-.03em;line-height:1.05;max-width:14ch}
.cta .blob{position:absolute;opacity:.4}
.cta .blob.a{left:auto;right:-10vmax;top:auto;bottom:-14vmax;transform:none;animation:float 9s ease-in-out infinite}
.cta .blob.b{left:-12vmax;right:auto;top:-8vmax;transform:none;animation:float 11s ease-in-out infinite reverse}
@keyframes float{50%{transform:translate(4vw,-5vh) scale(1.15)}}
.reveal{opacity:0;transform:translateY(60px) scale(.96);transition:opacity .9s,transform .9s cubic-bezier(.2,.8,.2,1)}
.reveal.on{opacity:1;transform:none}

.btn{position:relative;display:inline-flex;align-items:center;gap:.7rem;padding:1.15rem 2.4rem;border-radius:99px;border:3px solid var(--b1);background:#fff;color:var(--b1);font:inherit;font-weight:800;font-size:1.25rem;text-decoration:none;overflow:hidden;isolation:isolate;transition:color 1.1s ease,border-color 1.1s ease,transform .6s cubic-bezier(.2,.8,.2,1),box-shadow 1.1s ease}
.btn::before{content:"";position:absolute;inset:-2px;z-index:-1;background:linear-gradient(90deg,var(--b1),var(--b4) 45%,var(--c));transform:translateX(-101%);transition:transform 1.1s cubic-bezier(.25,.8,.25,1)}
.btn:hover,.btn:focus-visible{color:#fff;border-color:var(--c);transform:scale(1.05);box-shadow:0 18px 50px -12px rgba(5,17,242,.55)}
.btn:hover::before,.btn:focus-visible::before{transform:none}
.btn svg{width:1.5em;height:1.5em;fill:currentColor;transition:transform 1.1s}
.btn:hover svg{transform:rotate(360deg)}
.btn.sm{padding:.6rem 1.3rem;font-size:1rem;border-width:2px}
.nav{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:flex-end;padding:1rem 1.5rem;pointer-events:none}
.nav .btn{pointer-events:auto}
.hero .btn{margin-top:3vh;position:relative;opacity:calc((var(--p) - .8)*6)}

@media (max-width:600px){.nav .btn span{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>

<section class="pin hero" data-s>
  <div class="stick">
    <div class="blob a"></div><div class="blob b"></div><div class="blob c"></div>
    <img class="logo" src="tod-content/testyodreki_logo.svg" alt="Testy od ręki">
    <h1 class="slogan" data-words><span class="w">Z</span><span class="w">nami</span><span class="w big">SZÓSTKA</span><span class="w">to</span><span class="w">nie</span><span class="w big">PROBLEM!</span></h1>
    <a class="btn" href="https://discord.gg/2Uk2HHhctH" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M20.3 4.4A19.6 19.6 0 0 0 15.5 3l-.2.4a18 18 0 0 1 4.4 1.8 15 15 0 0 0-15.4 0A18 18 0 0 1 8.7 3.4L8.5 3a19.6 19.6 0 0 0-4.8 1.4C.7 8.900 0 13.300.3 17.600a19.700 19.700 0 0 0 6 3l1.300-2.100c-.7-.3-1.400-.6-2-1l.5-.4a14 14 0 0 0 12 0l.5.4c-.6.4-1.300.7-2 1l1.300 2.100a19.700 19.700 0 0 0 6-3c.4-5-.7-9.300-3.600-13.200zM8 15c-1.200 0-2.100-1-2.100-2.300S6.800 10.400 8 10.400s2.100 1 2.100 2.300S9.200 15 8 15zm8 0c-1.200 0-2.100-1-2.100-2.300s.9-2.300 2.100-2.300 2.100 1 2.100 2.300S17.200 15 16 15z"/></svg>Wejdź na Discorda</a>
  </div>
</section>

<section class="pin six" data-s>
  <div class="stick">
    <div class="sixbg"></div>
    <div class="digit">6</div>
    <div class="sixtext">Całość na naszym <span>serwerze Discord.</span></div>
  </div>
</section>

<section class="pin say" data-s>
  <div class="stick">
    <p data-reveal>Dostęp do testów, które pojawiają się u nauczyciela.</p>
    <div class="tags"><i>Testy</i><i>Kartkówki</i><i>Bazy zadań</i></div>
  </div>
</section>

<section class="cta">
  <div class="blob a" style="width:40vmax;height:40vmax;background:var(--c)"></div>
  <div class="blob b" style="width:36vmax;height:36vmax;background:var(--b3)"></div>
  <h2 class="reveal" data-in>Dołącz do społeczności.</h2>
  <a class="btn reveal" data-in href="https://discord.gg/2Uk2HHhctH" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M20.3 4.4A19.6 19.6 0 0 0 15.5 3l-.2.4a18 18 0 0 1 4.4 1.8 15 15 0 0 0-15.4 0A18 18 0 0 1 8.7 3.4L8.5 3a19.6 19.6 0 0 0-4.8 1.4C.7 8.900 0 13.300.3 17.600a19.700 19.700 0 0 0 6 3l1.300-2.100c-.7-.3-1.400-.6-2-1l.5-.4a14 14 0 0 0 12 0l.5.4c-.6.4-1.300.7-2 1l1.300 2.100a19.700 19.700 0 0 0 6-3c.4-5-.7-9.300-3.600-13.200zM8 15c-1.200 0-2.100-1-2.100-2.300S6.800 10.400 8 10.400s2.100 1 2.100 2.300S9.200 15 8 15zm8 0c-1.200 0-2.100-1-2.100-2.300s.9-2.300 2.100-2.300 2.100 1 2.100 2.300S17.200 15 16 15z"/></svg>https://testyodreki.pages.dev</a>
</section>

<script>
const S=[...document.querySelectorAll('[data-s]')];
const clamp=v=>Math.min(1,Math.max(0,v));
document.querySelectorAll('[data-reveal]').forEach(p=>{
  p.innerHTML=p.textContent.split(' ').map(w=>`<span class="r">${w}</span>`).join(' ');
});
const words=[...document.querySelectorAll('.slogan .w')];
const rw=[...document.querySelectorAll('[data-reveal] .r')];
function tick(){
  S.forEach(s=>{
    const r=s.getBoundingClientRect();
    s.style.setProperty('--p',clamp(-r.top/(r.height-innerHeight)).toFixed(4));
  });
  const hp=parseFloat(S[0].style.getPropertyValue('--p'));
  words.forEach((w,i)=>w.classList.toggle('on',hp>.12+i*.1));
  const sp=parseFloat(S[2].style.getPropertyValue('--p'));
  rw.forEach((w,i)=>w.classList.toggle('on',sp>.1+i/rw.length*.65));
}
addEventListener('scroll',()=>requestAnimationFrame(tick),{passive:true});
addEventListener('resize',tick);tick();
const io=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting)x.target.classList.add('on')}),{threshold:.3});
document.querySelectorAll('[data-in]').forEach((el,i)=>{el.style.transitionDelay=i*.15+'s';io.observe(el)});
</script>
</body>
</html>
