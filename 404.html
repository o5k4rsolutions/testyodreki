<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 - Nie znaleziono strony | Testy od ręki</title>
<style>
:root{
  --c1:#0511F2;
  --c2:#0455BF;
  --c3:#0597F2;
  --c4:#05F2DB;
  --c5:#008FFD;
  --bg:#f6faff;
  --ink:#06143a;
  --mute:#4a5b82;
  --card:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hartwell','Segoe UI',Helvetica,Arial,sans-serif;line-height:1.6;overflow-x:hidden}
img{max-width:100%}

.btn{position:relative;display:inline-block;overflow:hidden;isolation:isolate;padding:16px 34px;border-radius:999px;border:2px solid var(--c1);background:#fff;color:var(--c1);font:inherit;font-weight:700;font-size:1.05rem;text-decoration:none;cursor:pointer;transition:color .9s ease,transform .5s ease,box-shadow .9s ease}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,var(--c1),var(--c5),var(--c4));transform:translateX(-101%);transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.btn:hover,.btn:focus-visible{color:#fff;transform:translateY(-3px);box-shadow:0 14px 34px rgba(5,17,242,.28)}
.btn:hover::before,.btn:focus-visible::before{transform:none}
.btn.solid{background:var(--c1);color:#fff;border-color:var(--c1)}
.btn.solid::before{background:linear-gradient(90deg,var(--c4),var(--c3));transform:translateX(-101%)}
.btn.solid:hover,.btn.solid:focus-visible{color:var(--ink)}
.btn:focus-visible{outline:3px solid var(--c4);outline-offset:3px}

header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 5vw 10px;backdrop-filter:blur(14px);background:rgba(246,250,255,.72);transform:translateY(-100%);animation:drop 1s .3s forwards cubic-bezier(.2,.8,.2,1)}
@keyframes drop{to{transform:none}}
header img{height:46px;display:block}
header .btn{padding:10px 24px;font-size:.95rem}
.bar{position:fixed;top:0;left:0;height:4px;width:calc(var(--sp,0)*100%);background:linear-gradient(90deg,var(--c1),var(--c4));z-index:30}

.hero{position:relative;min-height:100vh;display:grid;place-items:center;text-align:center;padding:120px 6vw 80px;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;will-change:transform}
.b1{width:46vw;height:46vw;background:var(--c3);left:-12vw;top:-8vw;transform:translate(calc(var(--hp,0)*-8vw),calc(var(--hp,0)*30vh))}
.b2{width:38vw;height:38vw;background:var(--c4);right:-10vw;top:20vh;transform:translate(calc(var(--hp,0)*10vw),calc(var(--hp,0)*-20vh))}
.b3{width:30vw;height:30vw;background:var(--c1);opacity:.28;left:35vw;bottom:-14vw;transform:translateY(calc(var(--hp,0)*-40vh)) scale(calc(1 + var(--hp,0)))}
.hero-in{position:relative;z-index:2;transform:scale(calc(1 - var(--hp,0)*.25)) translateY(calc(var(--hp,0)*-8vh));opacity:calc(1 - var(--hp,0)*1.3);max-width:700px;margin:0 auto}

.err-code{font-size:clamp(4rem,14vw,9rem);font-weight:900;line-height:1;margin:0 0 .1em;letter-spacing:-.04em;background:linear-gradient(100deg,var(--c1),var(--c5),var(--c3),var(--c1));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 7s linear infinite}
@keyframes flow{to{background-position:-250% 0}}

h1{font-size:clamp(1.8rem,4.5vw,3rem);line-height:1.15;margin:0 auto .4em;color:var(--c2)}
.hero p{font-size:clamp(1.05rem,2vw,1.35rem);color:var(--mute);max-width:38ch;margin:0 auto 2.2em;animation:fade 1s 1s both}
.hero-btns{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;animation:fade 1s 1.3s both}
@keyframes fade{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

footer{text-align:center;padding:30px 6vw 40px;color:var(--mute);background:#f6faff;font-size:.9rem;position:relative;z-index:10}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hero-in,.err-code{transform:none!important;opacity:1!important;filter:none!important}header{transform:none}}
</style>
</head>
<body>
<div class="bar"></div>
<header>
  <a href="https://testyodreki.pages.dev"><img src="https://testyodreki.pages.dev/tod-content/testyodreki_logo.svg" alt="Testy od ręki"></a>
  <a class="btn solid" href="https://testyodreki.pages.dev">Strona główna</a>
</header>

<div class="hero">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="hero-in">
    <div class="err-code">404</div>
    <h1>Wygląda na to, że ten test gdzieś uciekł!</h1>
    <p>Strona, której szukasz, nie istnieje, została przeniesiona lub adres został wpisany błędnie.</p>
    <div class="hero-btns">
      <a class="btn solid" href="https://testyodreki.pages.dev">Wróć na stronę główną</a>
      <a class="btn" href="https://testyodreki.pages.dev/sklep">Przejdź do sklepu</a>
    </div>
  </div>
</div>

<footer>© 2026 - Testy od ręki</footer>

<script>
(function(){
  var root=document.documentElement,hero=document.querySelector('.hero');
  function clamp(v){return Math.max(0,Math.min(1,v))}
  function tick(){
    var h=window.innerHeight,y=window.scrollY;
    var max=document.body.scrollHeight-h;
    root.style.setProperty('--sp',max>0?y/max:0);
    hero.style.setProperty('--hp',clamp(y/h));
    ticking=false;
  }
  var ticking=false;
  function req(){if(!ticking){ticking=true;requestAnimationFrame(tick)}}
  addEventListener('scroll',req,{passive:true});addEventListener('resize',req);tick();
})();
</script>
</body>
</html>
