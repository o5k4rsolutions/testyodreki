<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 – TestyOdRęki</title>
<link rel="icon" href="/tod-content/favicon-testyodreki-logo.svg" type="image/svg+xml">
<style>
:root{--b1:#0511F2;--b2:#0455BF;--b3:#0597F2;--c:#05F2DB;--b4:#008FFD;--bg:#F4F9FF;--ink:#06145C}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Hartwell',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
main{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;text-align:center;padding:6vh 6vw}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;will-change:transform;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.blob.a{width:40vmax;height:40vmax;background:var(--c);left:-12vmax;top:-10vmax;animation:float 10s ease-in-out infinite}
.blob.b{width:38vmax;height:38vmax;background:var(--b3);right:-12vmax;bottom:-12vmax;animation:float 12s ease-in-out infinite reverse}
.blob.c{width:22vmax;height:22vmax;background:var(--b1);opacity:.22;right:20vw;top:-8vmax;animation:float 8s ease-in-out infinite}
@keyframes float{50%{margin:3vh 0 0 4vw}}
.logo{position:relative;width:min(48vw,300px);animation:in 1s cubic-bezier(.2,.8,.2,1) both}
.num{position:relative;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(7rem,28vw,20rem);line-height:.9;letter-spacing:-.04em;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.num span{background:linear-gradient(120deg,var(--b1),var(--b3) 55%,var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;animation:drop 1s cubic-bezier(.2,.8,.2,1) both}
.num span:nth-child(2){animation-delay:.15s;animation-name:drop,spin;animation-duration:1s,14s;animation-iteration-count:1,infinite;animation-timing-function:cubic-bezier(.2,.8,.2,1),linear;animation-delay:.15s,1.2s}
.num span:nth-child(3){animation-delay:.3s}
@keyframes drop{from{opacity:0;transform:translateY(-40vh) rotate(-20deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes in{from{opacity:0;transform:translateY(30px)}}
h1{position:relative;font-weight:800;font-size:clamp(1.6rem,4.4vw,3.2rem);letter-spacing:-.02em;line-height:1.1;animation:in 1s .5s cubic-bezier(.2,.8,.2,1) both}
.row{position:relative;display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;animation:in 1s .7s cubic-bezier(.2,.8,.2,1) both}
.btn{position:relative;display:inline-flex;align-items:center;gap:.6rem;padding:1rem 2.1rem;border-radius:99px;border:3px solid var(--b1);background:#fff;color:var(--b1);font:inherit;font-weight:800;font-size:1.15rem;text-decoration:none;overflow:hidden;isolation:isolate;transition:color 1.1s ease,border-color 1.1s ease,transform .6s cubic-bezier(.2,.8,.2,1),box-shadow 1.1s ease}
.btn::before{content:"";position:absolute;inset:-2px;z-index:-1;background:linear-gradient(90deg,var(--b1),var(--b4) 45%,var(--c));transform:translateX(-101%);transition:transform 1.1s cubic-bezier(.25,.8,.25,1)}
.btn:hover,.btn:focus-visible{color:#fff;border-color:var(--c);transform:scale(1.05);box-shadow:0 18px 50px -12px rgba(5,17,242,.55)}
.btn:hover::before,.btn:focus-visible::before{transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<main>
  <div class="blob a" data-m="30"></div><div class="blob b" data-m="-40"></div><div class="blob c" data-m="20"></div>
  <img class="logo" src="/tod-content/testyodreki_logo.svg" alt="Testy od ręki">
  <div class="num" data-m="-12" aria-label="404"><span>4</span><span>0</span><span>4</span></div>
  <h1>Tej strony nie ma. Test znajdziesz na Discordzie.</h1>
  <div class="row">
    <a class="btn" href="/">Strona główna</a>
  </div>
</main>
<script>
addEventListener('pointermove',e=>{
  const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;
  document.querySelectorAll('[data-m]').forEach(el=>{
    const k=+el.dataset.m;el.style.transform=`translate(${x*k}px,${y*k}px)`;
  });
});
</script>
</body>
</html>
